name: Release regression checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression — ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: finance
            suites: >-
              --test company_financial_accounts_api --test company_financial_position_api
              --test external_invoice_allocations_api --test external_invoices_api
              --test financial_phase2_api --test invoice_credit_notes_api
              --test invoices_api --test patient_account_statement_api --test stats_api
          - group: documents
            suites: >-
              --test documents_api --test patient_clinical_api --test staff_access_api
          - group: operations
            suites: >-
              --test admin_mfa_api --test concierge_expense_receipts_api
              --test concierge_operational_items_api --test me_api --test operations_p0_api
              --test provider_people_api --test provider_taxonomy_api --test concierge_partner_interactions_api
          - group: workspace
            suites: --test workspace_filters_api
          - group: medication-chat
            suites: >-
              --test medication_intelligence_api --test medication_names_api
              --test messages_portal_api
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Run focused integration suites
        env:
          REGRESSION_SUITES: ${{ matrix.suites }}
        run: cargo test -p gmed-server --locked --no-fail-fast $REGRESSION_SUITES
