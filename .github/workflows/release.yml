name: Release Build

# Builds and pushes production-approved, signed container images to GHCR.
# Triggered only by a version tag (`v*`) or an explicit manual promotion.
# Ordinary pushes to main are handled by dev.yml and can never produce an
# image signed by this production trust identity.
#
# Why a separate workflow:
#   - The CI workflow (.github/workflows/ci.yml) does a smoke `docker
#     build` for correctness; it does not push or sign release images.
#     Mixing the two slows every PR.
#   - Push and OIDC permissions are scoped here so PR builds from forks
#     never get write access to GHCR or Sigstore.
#
# Why cosign keyless:
#   - Avoids managing a signing key. The signature carries the
#     GitHub OIDC certificate identity, which the verifier on the host
#     pins to `<repo>/.github/workflows/release.yml`. A stolen image
#     pushed by an attacker who can't produce that certificate
#     identity fails verification.
#   - Signed with cosign 3 (new Sigstore bundle format, stored as an OCI
#     referrer). scripts/deploy-prod.sh verifies with the same cosign 3
#     version, which also accepts the cosign 2 signatures of older digests.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Read-only repo access — no contents:write needed.
  contents: read
  # GHCR pushes use the workflow token; packages:write gives it the
  # `push` scope for the org/user's container registry.
  packages: write
  # Required for cosign keyless: GHA mints an OIDC token that
  # Sigstore Fulcio exchanges for a short-lived signing cert.
  id-token: write
  # Required to upload Trivy SARIF results to the repo's Security tab.
  # Without this the scan still runs and gates the workflow; only the
  # nice in-UI presentation is lost.
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  # The full workspace gate: fmt and clippy here, every test in the three
  # application-test-gate shards beside it. All gates and the image builds
  # run at the same time; nothing is tagged or signed before all gates pass.
  application-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100"

      # Restores the cache ci.yml saves on main (same key). A tag run cannot
      # see caches of earlier tags, so it saves none.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-lint
          save-if: false

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # `cargo test --workspace --locked --no-fail-fast` split over three runners,
  # each with its own throwaway PostgreSQL (scripts/ci-rust-tests.sh).
  application-test-gate:
    name: application-test-gate (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-tests
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150

      - name: Rust tests
        run: bash scripts/ci-rust-tests.sh "${{ matrix.shard }}" 3 .github/workflows/release.yml

  # Static frontend checks and the repository checks. The browser gates run
  # beside it: mocked specs in four shards, the live backend gate on its own.
  frontend-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --audit-level=high --omit=dev

      - name: Frontend release check
        run: npm --prefix frontend run release:check:full

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Print binding audit
        run: python scripts/audit_print_bindings.py

      - name: Production migration preflight checks
        run: python -m unittest discover -s scripts -p test_preflight_prod_migrations.py

      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py

  frontend-browser-gate:
    name: frontend-browser-gate (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Secure chat mocked, lead cabinet and payer browser gate
        working-directory: frontend
        run: >-
          npx playwright test
          'tests/e2e/chat-secure\.spec\.ts'
          'lead-.*\.spec\.ts'
          'payer-link\.spec\.ts'
          --shard=${{ matrix.shard }}/4

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-browser-diagnostics-${{ matrix.shard }}
          path: frontend/test-results
          retention-days: 7

  frontend-live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust for the live backend
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100"

      # The key of ci.yml's operations-live-e2e job, which builds the same
      # debug backend on main.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: live-backend
          save-if: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Secure chat, realtime and cabinet live gate
        working-directory: frontend
        run: >-
          npx playwright test
          -c playwright.live.config.ts
          tests/e2e-live/chat-secure.live.spec.ts
          tests/e2e-live/realtime.live.spec.ts
          tests/e2e-live/cabinet-roundtrip.spec.ts

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-browser-diagnostics-live
          path: frontend/test-results
          retention-days: 7

  parser-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/clinical-document-parser
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/clinical-document-parser/pyproject.toml

      - name: Install parser test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile parser sources
        run: python -m compileall -q app benchmarks tests

      - name: Parser and OCR tests
        run: python -m pytest -q

      - name: Benchmark evaluator tests
        run: python -m unittest benchmarks.test_evaluator -v

      - name: Live synthetic parser gate
        run: >-
          python -m benchmarks.run
          --ground-truth benchmarks/examples/synthetic_ground_truth.json
          --fail-on-unsafe
          --minimum-candidate-f1 0.90
          --minimum-ocr-similarity 0.95
          --minimum-cohort-candidate-f1 0.90
          --minimum-cohort-ocr-similarity 0.95
          --required-cohort arztbrief
          --required-cohort laboratory
          --required-cohort medication
          --minimum-required-cohort-cases 1

  invoice-parser-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/invoice-parser/pyproject.toml
      - name: Install CPU OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install invoice parser test dependencies
        run: python -m pip install -e 'services/invoice-parser[dev]'
      - name: Invoice API, fields, structured formats and OCR tests
        working-directory: services/invoice-parser
        run: python -m pytest -q
      - name: Validate standalone Compose configuration
        env:
          INVOICE_PARSER_API_KEY: synthetic-compose-validation-key-000000000
        run: docker compose -f services/invoice-parser/compose.yml config --quiet

  # Builds, verifies and scans the images while the gates run. The images are
  # pushed by digest only: no tag points at them and nothing signs them until
  # the sign job, which waits for every gate and every build. An image of a
  # failed run stays untagged and unsigned, and PROD refuses unsigned digests.
  build-and-scan:
    # DEV and PROD Hetzner hosts use x86_64 CPX instances, so release
    # images are built for linux/amd64. Add linux/arm64 only if the
    # fleet moves back to CAX/ARM or you intentionally run mixed hosts.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            env_name: BACKEND
            dockerfile: Dockerfile.backend
            context: .
          - name: frontend
            env_name: FRONTEND
            dockerfile: frontend/Dockerfile
            context: frontend
          - name: clinical-document-parser
            env_name: PARSER
            dockerfile: services/clinical-document-parser/Dockerfile
            context: services/clinical-document-parser
          - name: invoice-parser
            env_name: INVOICE_PARSER
            dockerfile: services/invoice-parser/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve build metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # The image namespace mirrors the repo: a fork stays in its
          # own ghcr.io/<fork-owner>/<repo>-* scope automatically.
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=release
            type=raw,value=release-sha-${{ steps.source.outputs.short_sha }}
            type=ref,event=tag
            type=sha,prefix=release-sha-,format=short
          # SPDX provenance + OCI labels for traceability from a
          # registry browser back to this run.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_type == 'tag' && github.ref_name || format('release-sha-{0}', steps.source.outputs.short_sha) }}
            org.opencontainers.image.licenses=UNLICENSED

      - name: Download and verify the pinned translation model
        if: matrix.name == 'clinical-document-parser'
        run: |
          set -euo pipefail
          archive=services/clinical-document-parser/translation-model.argosmodel
          curl --fail --show-error --location --retry 3 --max-time 300 \
            https://argos-net.com/v1/translate-en_de-1_3.argosmodel --output "$archive"
          echo "6cd847f0c06c9c66013e6b0932e07fd54a6d90894659c02bf6c5247b72fb25b1  $archive" | sha256sum --check

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # The tags from the metadata step are applied by the sign job,
          # after all gates passed.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_RELEASE_CHANNEL=production
            VITE_BUILD_NUMBER=release-sha-${{ steps.source.outputs.short_sha }}
            VITE_BUILD_TIMESTAMP=${{ steps.source.outputs.build_timestamp }}
            ALPINE_SECURITY_REFRESH=${{ steps.source.outputs.build_timestamp }}
            DEBIAN_SECURITY_REFRESH=${{ steps.source.outputs.build_timestamp }}
          # SLSA-style provenance attached to the image. The
          # `mode=max` setting includes the build invocation graph
          # so `cosign tree` shows full lineage.
          provenance: mode=max
          sbom: true
          # A tag run can only read caches saved on main: the DEV build
          # (dev.yml, same Dockerfiles) keeps those warm. A cache written
          # here would be visible to this tag only and would push the main
          # caches out of the repository's cache quota, so none is written.
          cache-from: |
            type=gha,scope=dev-${{ matrix.name }}
            type=gha,scope=${{ matrix.name }}

      - name: Verify parser runtime before signing
        if: matrix.name == 'clinical-document-parser'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "$IMAGE_REF" -u)" -ne 0
          docker run --rm --network none --entrypoint python "$IMAGE_REF" -c "import time; from PIL import Image,ImageDraw,ImageFont; from app.extraction import _get_paddle_runtime, _run_paddle; from app.parser import parse_clinical_text; image=Image.new('RGB',(1600,420),'white'); font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72); ImageDraw.Draw(image).multiline_text((60,60),'Diagnosen\nArterielle Hypertonie',font=font,fill='black',spacing=28); outcome=_run_paddle(image,time.monotonic()+120); image.close(); _get_paddle_runtime().close(); draft=parse_clinical_text(outcome.text); recognized=outcome.text.casefold(); assert outcome.engine == 'paddle' and not outcome.timed_out and all(token in recognized for token in ('diagnosen','hypertonie')) and any(candidate.target == 'diagnosis' and 'hypertonie' in candidate.value.casefold() for candidate in draft.candidates)"
          docker run --rm --network none --entrypoint python "$IMAGE_REF" -c "from app.translation_runtime import translate_payload; from pathlib import Path; result=translate_payload({'text':'No evidence of pneumonia.','candidates':{}},Path('/app/models/translate-en_de-1_3')); assert result['text'] and result['text'] != 'No evidence of pneumonia.'"

      - name: Verify invoice parser runtime before signing
        if: matrix.name == 'invoice-parser'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "$IMAGE_REF" -u)" -ne 0
          docker run --rm -i --network none --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/services/invoice-parser/examples:/examples:ro" \
            --entrypoint python "$IMAGE_REF" - < services/invoice-parser/tests/smoke.py

      # Trivy gate runs AFTER push but BEFORE sign. If the scan fails,
      # the image lives in GHCR unsigned — and the host's cosign verify
      # (in scripts/deploy-prod.sh) refuses to deploy unsigned digests.
      # The signature is therefore the operational seal-of-approval:
      # "built AND passed all gates".
      #
      # `ignore-unfixed: true` skips CVEs that have no upstream fix yet.
      # We can't act on them; treating them as fatal would block every
      # release on a single un-patched advisory. Track those separately
      # via Dependabot / cargo-deny.
      - name: Trivy scan (HIGH+CRITICAL, fixable only)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.name }}.sarif

      # Upload findings to the Security tab even on success — gives a
      # browsable trend over time. `if: always()` ensures the SARIF is
      # uploaded even after the scan-fail short-circuits, so the
      # operator can see which CVEs blocked the release.
      - name: Upload Trivy SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Hand the digest and tags to the sign job
        env:
          IMAGE_NAME: ${{ matrix.name }}
          ENV_NAME: ${{ matrix.env_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mkdir -p release-image
          printf '%s\n' "$IMAGE_NAME" > release-image/name
          printf '%s\n' "$ENV_NAME" > release-image/env_name
          printf '%s\n' "$DIGEST" > release-image/digest
          printf '%s\n' $TAGS > release-image/tags

      - name: Upload digest and tags
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image-${{ matrix.name }}
          path: release-image
          if-no-files-found: error
          # "Re-run all jobs" builds new digests under the same name.
          overwrite: true
          retention-days: 7

  # Runs only when every gate and every image build/scan passed: tags the
  # images, signs each digest once and verifies the signature as PROD does.
  sign:
    needs:
      - application-quality-gate
      - application-test-gate
      - frontend-quality-gate
      - frontend-browser-gate
      - frontend-live-gate
      - parser-quality-gate
      - invoice-parser-quality-gate
      - build-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download digests and tags
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-image-*
          path: release-images

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images
        # `imagetools create` from a single source is a carbon copy; the
        # check below fails the release if a tag ever pointed elsewhere.
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          count=0
          for dir in release-images/release-image-*; do
            name="$(cat "$dir/name")"
            digest="$(cat "$dir/digest")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            repo="${REGISTRY}/${REPOSITORY}-${name}"
            while read -r tag; do
              [ -n "$tag" ] || continue
              case "$tag" in
                "$repo:"*) ;;
                *) echo "::error::unexpected tag $tag for $repo"; exit 1 ;;
              esac
              docker buildx imagetools create --tag "$tag" "$repo@$digest"
              tagged="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
              test "$tagged" = "$digest"
            done < "$dir/tags"
            count=$((count + 1))
          done
          test "$count" -eq 4

      # cosign 3 writes the signature as a Sigstore bundle attached to the
      # image as an OCI 1.1 referrer (new bundle format, service URLs from
      # the Sigstore TUF signing config). Images signed before this change
      # carry the legacy `sha256-<digest>.sig` tag; cosign 3 `verify` still
      # accepts those, cosign 2 does NOT accept the new bundles. The PROD
      # verifier in scripts/deploy-prod.sh is pinned to the same cosign
      # version below — change both together.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign images (keyless)
        # The signature covers the digest; every tag of an image names the
        # same repository@digest, so each image is signed once.
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sign_with_retry() {
            local ref="$1"
            local attempt
            for attempt in 1 2 3; do
              if cosign sign --yes "$ref"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 5))
            done
          }
          for dir in release-images/release-image-*; do
            ref="${REGISTRY}/${REPOSITORY}-$(cat "$dir/name")@$(cat "$dir/digest")"
            echo "::group::cosign sign $ref"
            sign_with_retry "$ref"
            echo "::endgroup::"
          done

      - name: Verify signature as PROD does
        # Same identity regexp and issuer as scripts/deploy-prod.sh, so a
        # signature PROD would refuse fails the release here instead of at
        # deploy time. Keep the two in sync.
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          verify_with_retry() {
            local image_ref="$1"
            local attempt
            for attempt in 1 2 3; do
              if cosign verify \
                --certificate-identity-regexp '^https://github\.com/oleksandrmelnychenko/gmed-crm/\.github/workflows/release\.yml@refs/(tags/v[0-9A-Za-z._-]+|heads/main)$' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$image_ref" >/dev/null; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 5))
            done
          }
          for dir in release-images/release-image-*; do
            verify_with_retry "${REGISTRY}/${REPOSITORY}-$(cat "$dir/name")@$(cat "$dir/digest")"
          done

      - name: Output digests
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for dir in release-images/release-image-*; do
            name="$(cat "$dir/name")"
            digest="$(cat "$dir/digest")"
            {
              echo "## ${name}"
              echo "Digest: \`${digest}\`"
              echo ""
              echo "Pin in PROD release-images.pins:"
              echo '```'
              echo "GMED_$(cat "$dir/env_name")_IMAGE=${REGISTRY}/${REPOSITORY}-${name}@${digest}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
