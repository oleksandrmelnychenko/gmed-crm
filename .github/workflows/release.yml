name: Release Build

# Builds and pushes production-approved, signed container images to GHCR.
# Triggered only by a version tag (`v*`) or an explicit manual promotion.
# Ordinary pushes to main are handled by dev.yml and can never produce an
# image signed by this production trust identity.
#
# Why a separate workflow:
#   - The CI workflow (.github/workflows/ci.yml) does a smoke `docker
#     build` for correctness; it does not push or sign release images.
#     Mixing the two slows every PR.
#   - Push and OIDC permissions are scoped here so PR builds from forks
#     never get write access to GHCR or Sigstore.
#
# Why cosign keyless:
#   - Avoids managing a signing key. The signature carries the
#     GitHub OIDC certificate identity, which the verifier on the host
#     pins to `<repo>/.github/workflows/release.yml`. A stolen image
#     pushed by an attacker who can't produce that certificate
#     identity fails verification.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Read-only repo access — no contents:write needed.
  contents: read
  # GHCR pushes use the workflow token; packages:write gives it the
  # `push` scope for the org/user's container registry.
  packages: write
  # Required for cosign keyless: GHA mints an OIDC token that
  # Sigstore Fulcio exchanges for a short-lived signing cert.
  id-token: write
  # Required to upload Trivy SARIF results to the repo's Security tab.
  # Without this the scan still runs and gates the workflow; only the
  # nice in-UI presentation is lost.
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  application-quality-gate:
    runs-on: ubuntu-latest
    # The full Rust workspace gate currently takes a little over 60 minutes
    # before the frontend release checks run, so keep enough headroom for both.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          test_log="$(mktemp)"
          set +e
          cargo test --workspace --locked 2>&1 | tee "$test_log"
          test_status="${PIPESTATUS[0]}"
          set -e
          if [ "$test_status" -ne 0 ]; then
            details="$(grep -E '^---- .* stdout ----$|panicked at|assertion|^  left:|^ right:|^failures:$|^    [[:alnum:]_].*::|^test result: FAILED|^error: test failed' "$test_log" | tail -n 80)"
            if [ -z "$details" ]; then
              details="$(tail -c 8000 "$test_log")"
            fi
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error file=.github/workflows/release.yml,title=Rust tests failed::$details"
          fi
          exit "$test_status"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --audit-level=high --omit=dev

      - name: Frontend release check
        run: npm --prefix frontend run release:check:full

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Secure chat mocked browser gate
        working-directory: frontend
        run: npx playwright test tests/e2e/chat-secure.spec.ts

      - name: Secure chat and realtime live gate
        working-directory: frontend
        run: >-
          npx playwright test
          -c playwright.live.config.ts
          tests/e2e-live/chat-secure.live.spec.ts
          tests/e2e-live/realtime.live.spec.ts

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Print binding audit
        run: python scripts/audit_print_bindings.py

      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py

  parser-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/clinical-document-parser
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/clinical-document-parser/pyproject.toml

      - name: Install parser test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile parser sources
        run: python -m compileall -q app benchmarks tests

      - name: Parser and OCR tests
        run: python -m pytest -q

      - name: Benchmark evaluator tests
        run: python -m unittest benchmarks.test_evaluator -v

      - name: Live synthetic parser gate
        run: >-
          python -m benchmarks.run
          --ground-truth benchmarks/examples/synthetic_ground_truth.json
          --fail-on-unsafe
          --minimum-candidate-f1 0.90
          --minimum-ocr-similarity 0.95
          --minimum-cohort-candidate-f1 0.90
          --minimum-cohort-ocr-similarity 0.95
          --required-cohort arztbrief
          --required-cohort laboratory
          --required-cohort medication
          --minimum-required-cohort-cases 1

  build-and-sign:
    needs: [application-quality-gate, parser-quality-gate]
    # DEV and PROD Hetzner hosts use x86_64 CPX instances, so release
    # images are built for linux/amd64. Add linux/arm64 only if the
    # fleet moves back to CAX/ARM or you intentionally run mixed hosts.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            env_name: BACKEND
            dockerfile: Dockerfile.backend
            context: .
          - name: frontend
            env_name: FRONTEND
            dockerfile: frontend/Dockerfile
            context: frontend
          - name: clinical-document-parser
            env_name: PARSER
            dockerfile: services/clinical-document-parser/Dockerfile
            context: services/clinical-document-parser
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve build metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # The image namespace mirrors the repo: a fork stays in its
          # own ghcr.io/<fork-owner>/<repo>-* scope automatically.
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=release
            type=ref,event=tag
            type=sha,prefix=release-sha-,format=short
          # SPDX provenance + OCI labels for traceability from a
          # registry browser back to this run.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_RELEASE_CHANNEL=production
            VITE_BUILD_NUMBER=release-sha-${{ steps.source.outputs.short_sha }}
            VITE_BUILD_TIMESTAMP=${{ steps.source.outputs.build_timestamp }}
            ALPINE_SECURITY_REFRESH=${{ steps.source.outputs.build_timestamp }}
            DEBIAN_SECURITY_REFRESH=${{ steps.source.outputs.build_timestamp }}
          # SLSA-style provenance attached to the image. The
          # `mode=max` setting includes the build invocation graph
          # so `cosign tree` shows full lineage.
          provenance: mode=max
          sbom: true
          # Re-use the GitHub Actions cache across runs.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Verify parser runtime before signing
        if: matrix.name == 'clinical-document-parser'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "$IMAGE_REF" -u)" -ne 0
          docker run --rm --entrypoint python "$IMAGE_REF" -c "import time; from PIL import Image,ImageDraw,ImageFont; from app.extraction import _get_paddle_runtime, _run_paddle; from app.parser import parse_clinical_text; image=Image.new('RGB',(1600,420),'white'); font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72); ImageDraw.Draw(image).multiline_text((60,60),'Diagnosen\nArterielle Hypertonie',font=font,fill='black',spacing=28); outcome=_run_paddle(image,time.monotonic()+120); image.close(); _get_paddle_runtime().close(); draft=parse_clinical_text(outcome.text); recognized=outcome.text.casefold(); assert outcome.engine == 'paddle' and not outcome.timed_out and all(token in recognized for token in ('diagnosen','hypertonie')) and any(candidate.target == 'diagnosis' and 'hypertonie' in candidate.value.casefold() for candidate in draft.candidates)"

      # Trivy gate runs AFTER push but BEFORE sign. If the scan fails,
      # the image lives in GHCR unsigned — and the host's cosign verify
      # (in scripts/deploy-prod.sh) refuses to deploy unsigned digests.
      # The signature is therefore the operational seal-of-approval:
      # "built AND passed all gates".
      #
      # `ignore-unfixed: true` skips CVEs that have no upstream fix yet.
      # We can't act on them; treating them as fatal would block every
      # release on a single un-patched advisory. Track those separately
      # via Dependabot / cargo-deny.
      - name: Trivy scan (HIGH+CRITICAL, fixable only)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.name }}.sarif

      # Upload findings to the Security tab even on success — gives a
      # browsable trend over time. `if: always()` ensures the SARIF is
      # uploaded even after the scan-fail short-circuits, so the
      # operator can see which CVEs blocked the release.
      - name: Upload Trivy SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        # Sign EACH digest produced by docker/metadata-action. We build
        # amd64 only today; the loop stays ready for a multi-arch follow-up.
        env:
          COSIGN_EXPERIMENTAL: '1'
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            ref="${tag%%:*}@${DIGEST}"
            echo "::group::cosign sign $ref"
            cosign sign --yes "$ref"
            echo "::endgroup::"
          done

      - name: Output digest
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin in PROD release.env:"
            echo '```'
            echo "GMED_${{ matrix.env_name }}_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
