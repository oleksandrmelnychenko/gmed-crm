name: Invoice parser

on:
  pull_request:
    paths:
      - services/invoice-parser/**
      - services/clinical-document-parser/app/extraction.py
      - services/clinical-document-parser/app/paddle_runtime.py
      - .github/workflows/invoice-parser.yml
  push:
    branches: [main, master]
    paths:
      - services/invoice-parser/**
      - services/clinical-document-parser/app/extraction.py
      - services/clinical-document-parser/app/paddle_runtime.py
      - .github/workflows/invoice-parser.yml
  workflow_dispatch:

jobs:
  invoice-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/invoice-parser/pyproject.toml
      - name: Install CPU OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install service and test dependencies
        run: python -m pip install -e 'services/invoice-parser[dev]'
      - name: Test API, invoice fields and real OCR
        working-directory: services/invoice-parser
        run: python -m pytest -q
      - name: Validate standalone Compose configuration
        env:
          INVOICE_PARSER_API_KEY: synthetic-compose-validation-key-000000000
        run: docker compose -f services/invoice-parser/compose.yml config --quiet
      - name: Build standalone image
        run: docker build -f services/invoice-parser/Dockerfile -t gmed-invoice-parser:ci .
      - name: Test the image with real OCR and no network
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/services/invoice-parser/examples:/examples:ro" \
            --entrypoint python gmed-invoice-parser:ci - < services/invoice-parser/tests/smoke.py
