name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          test_log="$(mktemp)"
          set +e
          cargo test --workspace --locked 2>&1 | tee "$test_log"
          test_status="${PIPESTATUS[0]}"
          set -e
          if [ "$test_status" -ne 0 ]; then
            details="$(grep -E '^---- .* stdout ----$|panicked at|assertion|^  left:|^ right:|^failures:$|^    [[:alnum:]_].*::|^test result: FAILED|^error: test failed' "$test_log" | tail -n 80)"
            if [ -z "$details" ]; then
              details="$(tail -c 8000 "$test_log")"
            fi
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error file=.github/workflows/ci.yml,title=Rust tests failed::$details"
          fi
          exit "$test_status"

  rust-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Audit dependencies
        run: npm --prefix frontend audit --audit-level=high --omit=dev

      - name: Lint
        run: npm --prefix frontend run release:check

      - name: Test
        run: npm --prefix frontend run test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Secure chat browser gate
        working-directory: frontend
        run: npx playwright test tests/e2e/chat-secure.spec.ts

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Capacitor dependencies
        run: npm --prefix frontend ci

      - name: Build mobile assets and generate Capacitor Android dependencies
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://console.gmed-health.com
        run: npm run mobile:sync:release

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            frontend/android/*.gradle
            frontend/android/gradle/wrapper/gradle-wrapper.properties
            frontend/android/app/*.gradle

      - name: Test, lint and shrink Android app
        working-directory: frontend/android
        run: bash ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

  operations-live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run P0 operations browser regression
        working-directory: frontend
        run: >-
          npx playwright test
          -c playwright.live.config.ts
          tests/e2e-live/operations-p0.live.spec.ts
          tests/e2e-live/rbac-denied-routes.live.spec.ts
          tests/e2e-live/chat-secure.live.spec.ts
          tests/e2e-live/realtime.live.spec.ts

  clinical-document-parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/clinical-document-parser
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/clinical-document-parser/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile
        run: python -m compileall -q app benchmarks tests

      - name: Parser and OCR tests
        run: python -m pytest -q

      - name: Benchmark evaluator tests
        run: python -m unittest benchmarks.test_evaluator -v

      - name: Synthetic quality gate
        run: >-
          python -m benchmarks.run
          --ground-truth benchmarks/examples/synthetic_ground_truth.json
          --fail-on-unsafe
          --minimum-candidate-f1 0.90
          --minimum-ocr-similarity 0.95
          --minimum-cohort-candidate-f1 0.90
          --minimum-cohort-ocr-similarity 0.95
          --required-cohort arztbrief
          --required-cohort laboratory
          --required-cohort medication
          --minimum-required-cohort-cases 1

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --file Dockerfile.backend --tag gmed-backend:ci .

      - name: Smoke test backend OCR languages
        run: >-
          docker run --rm --entrypoint sh gmed-backend:ci
          -c 'for lang in deu eng rus ukr; do tesseract --list-langs | grep -qx "$lang"; done'

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag gmed-frontend:ci frontend

      - name: Build clinical document parser image
        run: docker build --file services/clinical-document-parser/Dockerfile --tag gmed-clinical-document-parser:ci services/clinical-document-parser

      - name: Verify parser image is non-root
        run: test "$(docker run --rm --entrypoint id gmed-clinical-document-parser:ci -u)" -ne 0

      - name: Smoke test isolated Paddle runtime
        run: >-
          docker run --rm --entrypoint python
          gmed-clinical-document-parser:ci
          -c "import time; from PIL import Image,ImageDraw,ImageFont; from app.extraction import _get_paddle_runtime, _run_paddle; from app.parser import parse_clinical_text; image=Image.new('RGB',(1600,420),'white'); font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72); ImageDraw.Draw(image).multiline_text((60,60),'Diagnosen\nArterielle Hypertonie',font=font,fill='black',spacing=28); outcome=_run_paddle(image,time.monotonic()+120); image.close(); _get_paddle_runtime().close(); recognized=outcome.text.casefold(); draft=parse_clinical_text(outcome.text); assert outcome.engine == 'paddle' and not outcome.timed_out and all(token in recognized for token in ('diagnosen','hypertonie')) and any(candidate.target == 'diagnosis' and 'hypertonie' in candidate.value.casefold() for candidate in draft.candidates)"

      - name: Smoke test Ukrainian Tesseract runtime
        run: >-
          docker run --rm --entrypoint python
          gmed-clinical-document-parser:ci
          -c "import time; from PIL import Image,ImageDraw,ImageFont; from app.extraction import _run_tesseract; image=Image.new('RGB',(1600,420),'white'); font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72); ImageDraw.Draw(image).multiline_text((60,60),'Діагноз\nАртеріальна гіпертонія',font=font,fill='black',spacing=28); outcome=_run_tesseract(image,'ukr+eng',time.monotonic()+60); image.close(); recognized=outcome.text.casefold(); assert not outcome.timed_out and all(token in recognized for token in ('діагноз','гіпертонія'))"

      - name: Validate release compose stack
        env:
          GMED_JWT_SECRET: ci-secret-at-least-32-characters-long!!
          GMED_MESSAGE_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GMED_MESSAGE_ENCRYPTION_KEY_ACTIVE: v1
          GMED_CORS_ORIGIN: http://localhost:8080
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml config > /dev/null

      - name: Validate production GHCR compose stack
        env:
          GMED_DATABASE_URL: postgres://gmed:ci-password@postgres:5432/gmed
          GMED_JWT_SECRET: ci-secret-at-least-32-characters-long!!
          GMED_MESSAGE_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GMED_MESSAGE_ENCRYPTION_KEY_ACTIVE: v1
          GMED_CORS_ORIGIN: https://console.example.test
          POSTGRES_USER: gmed
          POSTGRES_PASSWORD: ci-password
          POSTGRES_METRICS_USER: gmed_metrics
          POSTGRES_METRICS_PASSWORD: ci-metrics-password
          CADDY_HOSTNAME: console.example.test
          ACME_EMAIL: ops@example.test
          GMED_BACKEND_IMAGE: ghcr.io/example/gmed-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GMED_FRONTEND_IMAGE: ghcr.io/example/gmed-frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GMED_PARSER_IMAGE: ghcr.io/example/gmed-clinical-document-parser@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.release.yml
          -f docker-compose.hetzner.yml
          -f docker-compose.prod-hetzner.yml
          -f docker-compose.ghcr.yml
          config > /dev/null

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Repo hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Print binding audit
        run: python scripts/audit_print_bindings.py
