name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# No job here needs more than a read-only checkout: nothing is pushed,
# commented on or uploaded to the Security tab. Without this block the token
# gets the repository default, which may include write access.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running CI.
# Release builds (release.yml) are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-deployment-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check DEV runner syntax and recovery
        run: |
          bash -n scripts/deploy-dev-current.sh
          bash -n scripts/deploy-dev.sh
          python3 -m unittest discover -s scripts -p test_deploy_dev_current.py -v
          python3 -m unittest discover -s scripts -p test_release_image_coverage.py -v

  # fmt and clippy run beside the test shards: clippy only type-checks, so it
  # shares no build output with the tests and would only lengthen a shard.
  rust-lint:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100"

      # The same key in release.yml: a tag run can restore caches saved on
      # main, never those of an earlier tag (each tag run used to start cold).
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-lint

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The whole workspace test suite in three shards on three runners, each with
  # its own throwaway PostgreSQL (scripts/ci-rust-tests.sh).
  rust-tests:
    name: rust-tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-tests
          # The shards build the same thing; one upload is enough.
          save-if: ${{ matrix.shard == 1 }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150

      - name: Test
        run: bash scripts/ci-rust-tests.sh "${{ matrix.shard }}" 3 .github/workflows/ci.yml

  # The required status check: green only when fmt, clippy and every test
  # shard passed.
  rust:
    if: always()
    needs: [rust-lint, rust-tests]
    runs-on: ubuntu-latest
    steps:
      - name: All Rust checks passed
        env:
          LINT: ${{ needs.rust-lint.result }}
          TESTS: ${{ needs.rust-tests.result }}
        run: test "$LINT" = success && test "$TESTS" = success

  rust-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Audit dependencies
        run: npm --prefix frontend audit --audit-level=high --omit=dev

      - name: Lint
        run: npm --prefix frontend run release:check

      - name: Test
        run: npm --prefix frontend run test

      # The specs import app models. When one of those stops loading in Node,
      # Playwright collects no test at all; that stayed unnoticed on main.
      - name: Browser specs load
        working-directory: frontend
        run: npx playwright test --list

  # Mocked-API browser gates in four shards (by spec file) on four runners:
  # secure chat; clinical document import (it went unnoticed broken for weeks
  # while it ran nowhere); the patient-facing lead cabinet in four languages
  # and the payer link.
  frontend-browser:
    name: frontend-browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Secure chat, clinical import, lead cabinet and payer browser gate
        working-directory: frontend
        run: >-
          npx playwright test
          'tests/e2e/chat-secure\.spec\.ts'
          'tests/e2e/clinical-document-import\.spec\.ts'
          'lead-.*\.spec\.ts'
          'payer-link\.spec\.ts'
          --shard=${{ matrix.shard }}/4

  # The required status check: green only when the checks and every browser
  # shard passed.
  frontend:
    if: always()
    needs: [frontend-checks, frontend-browser]
    runs-on: ubuntu-latest
    steps:
      - name: All frontend checks passed
        env:
          CHECKS: ${{ needs.frontend-checks.result }}
          BROWSER: ${{ needs.frontend-browser.result }}
        run: test "$CHECKS" = success && test "$BROWSER" = success

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Capacitor dependencies
        run: npm --prefix frontend ci

      - name: Build mobile assets and generate Capacitor Android dependencies
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://console.gmed-health.com
        run: npm run mobile:sync:release

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            frontend/android/*.gradle
            frontend/android/gradle/wrapper/gradle-wrapper.properties
            frontend/android/app/*.gradle

      - name: Test, lint and shrink Android app
        working-directory: frontend/android
        run: bash ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

  operations-live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100"

      # Shared with release.yml's frontend-live-gate (same debug backend).
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: live-backend

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run P0 operations browser regression
        working-directory: frontend
        run: >-
          npx playwright test
          -c playwright.live.config.ts
          tests/e2e-live/operations-p0.live.spec.ts
          tests/e2e-live/rbac-denied-routes.live.spec.ts
          tests/e2e-live/chat-secure.live.spec.ts
          tests/e2e-live/realtime.live.spec.ts
          tests/e2e-live/cabinet-roundtrip.spec.ts
          tests/e2e-live/staff-client-form.live.spec.ts

      - name: Upload failed live browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operations-live-e2e-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  clinical-document-parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/clinical-document-parser
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/clinical-document-parser/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile
        run: python -m compileall -q app benchmarks tests

      - name: Parser and OCR tests
        run: python -m pytest -q

      - name: Benchmark evaluator tests
        run: python -m unittest benchmarks.test_evaluator -v

      - name: Synthetic quality gate
        run: >-
          python -m benchmarks.run
          --ground-truth benchmarks/examples/synthetic_ground_truth.json
          --fail-on-unsafe
          --minimum-candidate-f1 0.90
          --minimum-ocr-similarity 0.95
          --minimum-cohort-candidate-f1 0.90
          --minimum-cohort-ocr-similarity 0.95
          --required-cohort arztbrief
          --required-cohort laboratory
          --required-cohort medication
          --minimum-required-cohort-cases 1

  invoice-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/invoice-parser/pyproject.toml
      - name: Install CPU OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install invoice parser test dependencies
        run: python -m pip install -e 'services/invoice-parser[dev]'
      - name: Invoice API, fields, structured formats and OCR tests
        working-directory: services/invoice-parser
        run: python -m pytest -q
      - name: Validate standalone Compose configuration
        env:
          INVOICE_PARSER_API_KEY: synthetic-compose-validation-key-000000000
        run: docker compose -f services/invoice-parser/compose.yml config --quiet

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # BuildKit with the Actions cache: unchanged layers (system packages,
      # npm and pip installs) are reused instead of rebuilt on every push.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.backend
          tags: gmed-backend:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,scope=ci-backend,mode=max

      - name: Smoke test backend OCR languages
        run: >-
          docker run --rm --entrypoint sh gmed-backend:ci
          -c 'for lang in deu eng rus ukr; do tesseract --list-langs | grep -qx "$lang"; done'

      # Imported Word templates are converted to PDF by LibreOffice inside
      # the backend (crates/server/src/docx_render.rs).
      - name: Smoke test backend Word converter
        run: >-
          docker run --rm --entrypoint sh gmed-backend:ci
          -c 'soffice --headless --version | grep -q LibreOffice'

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend
          file: frontend/Dockerfile
          tags: gmed-frontend:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,scope=ci-frontend,mode=max

      - name: Download and verify the pinned translation model
        run: |
          set -euo pipefail
          archive=services/clinical-document-parser/translation-model.argosmodel
          curl --fail --show-error --location --retry 3 --max-time 300 \
            https://argos-net.com/v1/translate-en_de-1_3.argosmodel --output "$archive"
          echo "6cd847f0c06c9c66013e6b0932e07fd54a6d90894659c02bf6c5247b72fb25b1  $archive" | sha256sum --check

      - name: Build clinical document parser image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/clinical-document-parser
          file: services/clinical-document-parser/Dockerfile
          tags: gmed-clinical-document-parser:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=ci-clinical-document-parser
          cache-to: type=gha,scope=ci-clinical-document-parser,mode=max

      - name: Verify parser image is non-root
        run: test "$(docker run --rm --entrypoint id gmed-clinical-document-parser:ci -u)" -ne 0

      - name: Smoke test isolated Paddle runtime
        # Same confinement as the service in docker-compose.release.yml: no
        # network, read-only root filesystem, /tmp in memory, no capabilities.
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:size=512m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true
          --entrypoint python
          gmed-clinical-document-parser:ci
          -c "import time; from PIL import Image,ImageDraw,ImageFont; from app.extraction import _get_paddle_runtime, _run_paddle; from app.parser import parse_clinical_text; image=Image.new('RGB',(1600,420),'white'); font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72); ImageDraw.Draw(image).multiline_text((60,60),'Diagnosen\nArterielle Hypertonie',font=font,fill='black',spacing=28); outcome=_run_paddle(image,time.monotonic()+120); image.close(); _get_paddle_runtime().close(); recognized=outcome.text.casefold(); draft=parse_clinical_text(outcome.text); assert outcome.engine == 'paddle' and not outcome.timed_out and all(token in recognized for token in ('diagnosen','hypertonie')) and any(candidate.target == 'diagnosis' and 'hypertonie' in candidate.value.casefold() for candidate in draft.candidates)"

      - name: Smoke test Ukrainian Tesseract runtime
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:size=512m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true
          --entrypoint python
          gmed-clinical-document-parser:ci
          -c "import time; from PIL import Image,ImageDraw,ImageFont; from app.extraction import _run_tesseract; image=Image.new('RGB',(1600,420),'white'); font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72); ImageDraw.Draw(image).multiline_text((60,60),'Діагноз\nАртеріальна гіпертонія',font=font,fill='black',spacing=28); outcome=_run_tesseract(image,'ukr+eng',time.monotonic()+60); image.close(); recognized=outcome.text.casefold(); assert not outcome.timed_out and all(token in recognized for token in ('діагноз','гіпертонія'))"

      - name: Validate release compose stack
        env:
          GMED_JWT_SECRET: ci-secret-at-least-32-characters-long!!
          GMED_MESSAGE_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GMED_MESSAGE_ENCRYPTION_KEY_ACTIVE: v1
          GMED_CORS_ORIGIN: http://localhost:8080
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml config > /dev/null

      - name: Validate production GHCR compose stack
        env:
          GMED_DATABASE_URL: postgres://gmed:ci-password@postgres:5432/gmed
          GMED_JWT_SECRET: ci-secret-at-least-32-characters-long!!
          GMED_MESSAGE_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GMED_MESSAGE_ENCRYPTION_KEY_ACTIVE: v1
          GMED_CORS_ORIGIN: https://console.example.test
          POSTGRES_USER: gmed
          POSTGRES_PASSWORD: ci-password
          POSTGRES_METRICS_USER: gmed_metrics
          POSTGRES_METRICS_PASSWORD: ci-metrics-password
          CADDY_HOSTNAME: console.example.test
          ACME_EMAIL: ops@example.test
          GMED_BACKEND_IMAGE: ghcr.io/example/gmed-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GMED_FRONTEND_IMAGE: ghcr.io/example/gmed-frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GMED_PARSER_IMAGE: ghcr.io/example/gmed-clinical-document-parser@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          GMED_INVOICE_PARSER_IMAGE: ghcr.io/example/gmed-invoice-parser@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          GMED_INVOICE_PARSER_API_KEY: synthetic-compose-validation-key-000000000
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.release.yml
          -f docker-compose.hetzner.yml
          -f docker-compose.prod-hetzner.yml
          -f docker-compose.ghcr.yml
          config > /dev/null

  einvoice-validation:
    # Outgoing e-invoices must pass the official EN 16931 / ZUGFeRD rules, not
    # only our own arithmetic. The samples come from the Rust unit tests.
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      MUSTANG_VERSION: 2.26.0
      MUSTANG_SHA256: 42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Export sample e-invoices
        run: EINVOICE_SAMPLE_DIR="$PWD/target/einvoice-samples" cargo test -p gmed-server --locked --lib -- zugferd::tests::samples_can_be_exported_for_external_validation routes::invoices::tests::invoice_pdf_preserves_cyrillic_text

      - name: Download Mustang validator
        run: |
          curl -sSL -o Mustang-CLI.jar "https://github.com/ZUGFeRD/mustangproject/releases/download/core-${MUSTANG_VERSION}/Mustang-CLI-${MUSTANG_VERSION}.jar"
          echo "${MUSTANG_SHA256}  Mustang-CLI.jar" | sha256sum -c -

      - name: Validate XML (EN 16931 Schematron) and hybrid PDF (PDF/A-3)
        run: |
          set -euo pipefail
          status=0
          for file in target/einvoice-samples/*.xml target/einvoice-samples/*.pdf; do
            echo "== $file"
            if ! java -Xmx1G -Dfile.encoding=UTF-8 -jar Mustang-CLI.jar --action validate --source "$file" --no-notices 2>/dev/null | tee "$file.report.xml" | grep -q '<summary status="valid"/>'; then
              grep -oE '\[BR[^]]*\][^<]{0,240}' "$file.report.xml" | sort -u || true
              status=1
            fi
          done
          exit "$status"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Repo hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Print binding audit
        run: python scripts/audit_print_bindings.py
