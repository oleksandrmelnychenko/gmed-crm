[package]
name = "gmed-scan"
version = "0.2.0"
edition = "2024"
publish = false
description = "Scan station agent: drives an eSCL (AirScan) network scanner and files the scans into the GMED document intake queue"

[lib]
name = "gmed_scan"
path = "src/lib.rs"

[[bin]]
name = "gmed-scan"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
lopdf = { version = "0.42.0", default-features = false }
mdns-sd = "0.21"
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json", "multipart"] }
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
