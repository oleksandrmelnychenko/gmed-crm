[package]
name = "gmed-server"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "gmed_server"
path = "src/lib.rs"

[[bin]]
name = "gmed-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-prometheus = "0.10"
# Business-metric facade. Pinned to the same major version that
# axum-prometheus 0.10 transitively pulls (0.24) — using a different
# major would create two independent global recorders and metrics
# emitted from handlers would not flow to the /metrics endpoint.
metrics = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "process", "time"] }
tower-http = { version = "0.7", features = ["cors", "trace", "set-header"] }
tower_governor = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
chrono-tz = "0.10"
dotenvy = "0.15"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
aes-gcm = "0.11"
thiserror = "2"
http = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }
rust_decimal = "1"
printpdf = { version = "0.12.8", default-features = false }
pdf-extract = "0.12.0"
lopdf = { version = "0.46.0", default-features = false }
ttf-parser = "0.25.1"
datamatrix = "0.3"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
regex = "1"
# MX lookups for e-mail domains (email_domain.rs); system resolver config.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rss = "2"
quick-xml = "0.42"

secrecy = { version = "0.10", features = ["serde"] }
gmed-domain = { path = "../domain" }
gmed-shared = { path = "../shared" }
gmed-db = { path = "../db" }
hmac = "0.13"
sha1 = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30"
chrono = { version = "0.4" }
reqwest = { version = "0.13", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
