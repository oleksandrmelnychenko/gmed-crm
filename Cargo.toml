[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/shared",
    "crates/db",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

# Only the source-built DEV deployment selects this memory-bounded profile.
# Keep release/production optimizations and runtime assertions unchanged.
[profile.dev-fast]
inherits = "release"
opt-level = 1
lto = "off"
codegen-units = 16
incremental = false

[profile.test]
debug = 0
incremental = false
