services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmed} -d ${POSTGRES_DB:-gmed}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${GMED_DATABASE_URL:-postgres://gmed:gmed@postgres:5432/gmed}"
      PORT: 3000
      JWT_SECRET: "${GMED_JWT_SECRET:?Set GMED_JWT_SECRET in your environment or release env file}"
      MESSAGE_ENCRYPTION_KEYS: "${GMED_MESSAGE_ENCRYPTION_KEYS:?Set GMED_MESSAGE_ENCRYPTION_KEYS in your environment or release env file}"
      MESSAGE_ENCRYPTION_KEY_ACTIVE: "${GMED_MESSAGE_ENCRYPTION_KEY_ACTIVE:-v1}"
      AUDIT_IP_SALT: "${GMED_AUDIT_IP_SALT:-}"
      CORS_ORIGIN: "${GMED_CORS_ORIGIN:-http://localhost:8080,https://localhost,capacitor://localhost}"
      LEAD_INTAKE_TOKEN: "${GMED_LEAD_INTAKE_TOKEN:-}"
      RUST_LOG: "${GMED_RUST_LOG:-info,gmed_server=debug}"
      LOG_FORMAT: "${GMED_LOG_FORMAT:-json}"
      GMED_GBA_AIS_DOWNLOAD_URL: "${GMED_GBA_AIS_DOWNLOAD_URL:-}"
      GMED_MEDICATION_AI_ENABLED: "${GMED_MEDICATION_AI_ENABLED:-false}"
      GMED_MEDICATION_AI_DATA_TRANSFER_APPROVED: "${GMED_MEDICATION_AI_DATA_TRANSFER_APPROVED:-false}"
      GMED_MEDICATION_AI_GOVERNANCE_REVIEW_ID: "${GMED_MEDICATION_AI_GOVERNANCE_REVIEW_ID:-}"
      GMED_OPENAI_API_KEY: "${GMED_OPENAI_API_KEY:-}"
      GMED_OPENAI_MODEL: "${GMED_OPENAI_MODEL:-}"
      GMED_UPLOAD_SCANNER_REQUIRED: "true"
      DOCUMENT_OCR_TIMEOUT_SECONDS: "${GMED_DOCUMENT_OCR_TIMEOUT_SECONDS:-30}"
      DOCUMENT_OCR_MAX_CONCURRENCY: "${GMED_DOCUMENT_OCR_MAX_CONCURRENCY:-2}"
      DOCUMENT_OCR_LANGUAGES: "${GMED_DOCUMENT_OCR_LANGUAGES:-deu+eng+ukr+rus}"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads

  clinical-document-parser:
    build:
      context: ./services/clinical-document-parser
      dockerfile: Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${GMED_DATABASE_URL:-postgres://gmed:gmed@postgres:5432/gmed}"
      GMED_UPLOAD_DIR: "/app/uploads/documents"
      PARSER_POLL_SECONDS: "${GMED_PARSER_POLL_SECONDS:-2}"
      PARSER_MAX_FILE_BYTES: "${GMED_PARSER_MAX_FILE_BYTES:-26214400}"
      PARSER_MAX_PDF_PAGES: "${GMED_PARSER_MAX_PDF_PAGES:-80}"
      PARSER_MAX_IMAGE_PIXELS: "${GMED_PARSER_MAX_IMAGE_PIXELS:-50000000}"
      PARSER_MAX_EXTRACTED_TEXT_CHARS: "${GMED_PARSER_MAX_EXTRACTED_TEXT_CHARS:-500000}"
      PARSER_MAX_DRAFT_CANDIDATES: "${GMED_PARSER_MAX_DRAFT_CANDIDATES:-500}"
      PARSER_MAX_SOURCE_EVIDENCE_CHARS: "${GMED_PARSER_MAX_SOURCE_EVIDENCE_CHARS:-20000}"
      PARSER_MAX_SERIALIZED_DRAFT_BYTES: "${GMED_PARSER_MAX_SERIALIZED_DRAFT_BYTES:-2097152}"
      PARSER_LEASE_SECONDS: "${GMED_PARSER_LEASE_SECONDS:-1200}"
      PARSER_OCR_ENGINE: "${GMED_PARSER_OCR_ENGINE:-paddle}"
      PARSER_OCR_PAGE_TIMEOUT_SECONDS: "${GMED_PARSER_OCR_PAGE_TIMEOUT_SECONDS:-45}"
      PARSER_OCR_DOCUMENT_TIMEOUT_SECONDS: "${GMED_PARSER_OCR_DOCUMENT_TIMEOUT_SECONDS:-300}"
      PARSER_PADDLE_ISOLATE_PROCESS: "${GMED_PARSER_PADDLE_ISOLATE_PROCESS:-true}"
      PARSER_PADDLE_FAILURE_THRESHOLD: "${GMED_PARSER_PADDLE_FAILURE_THRESHOLD:-2}"
      PARSER_PADDLE_COOLDOWN_SECONDS: "${GMED_PARSER_PADDLE_COOLDOWN_SECONDS:-60}"
      PARSER_OCR_MULTIPASS: "${GMED_PARSER_OCR_MULTIPASS:-true}"
      PARSER_OCR_PRIMARY_LANGUAGES: "${GMED_PARSER_OCR_PRIMARY_LANGUAGES:-deu+eng}"
      PARSER_OCR_CYRILLIC_LANGUAGES: "${GMED_PARSER_OCR_CYRILLIC_LANGUAGES:-deu+eng+rus+ukr}"
      PARSER_OCR_UKRAINIAN_LANGUAGES: "${GMED_PARSER_OCR_UKRAINIAN_LANGUAGES:-deu+eng+ukr}"
      PARSER_OCR_RUSSIAN_LANGUAGES: "${GMED_PARSER_OCR_RUSSIAN_LANGUAGES:-deu+eng+rus}"
    restart: unless-stopped
    mem_limit: "${GMED_PARSER_MEMORY_LIMIT:-3g}"
    cpus: "${GMED_PARSER_CPUS:-3.0}"
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - uploads:/app/uploads:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      GMED_BACKEND_UPSTREAM: "${GMED_FRONTEND_BACKEND_UPSTREAM:-http://backend:3000}"
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  uploads:
