[project]
name = "gmed-clinical-document-parser"
version = "0.1.0"
description = "Draft-only OCR and clinical structure extraction for GMED"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<5",
  "pytesseract>=0.3.13,<1",
  "Pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
paddle = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
