[project]
name = "gmed-clinical-document-parser"
version = "0.1.0"
description = "Draft-only OCR and clinical structure extraction for GMED"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.161,<1",
  "uvicorn[standard]>=0.54,<1",
  "python-multipart>=0.0.32,<1",
  "pydantic>=2.14,<3",
  "pypdf>=6.21,<7",
  "pypdfium2>=5.14,<6",
  "pytesseract>=0.3.13,<1",
  "Pillow>=13,<14",
  "psycopg[binary]>=3.3,<4",
  "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1"]
translation = ["ctranslate2==4.8.3", "sentencepiece==0.2.2"]
paddle = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
