[project]
name = "gmed-invoice-parser"
version = "0.1.0"
description = "Local invoice OCR and review drafts for GMED"
requires-python = ">=3.12"
dependencies = [
  "invoice2data==1.0.1",
  "fastapi>=0.161,<1",
  "uvicorn>=0.54,<1",
  "pydantic>=2.14,<3",
  "psutil>=7.2,<8",
  "pypdf==6.21.2",
  "pypdfium2>=5.14,<6",
  "pytesseract>=0.3.13,<1",
  "Pillow>=13,<14",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invoice_parser"]

[tool.pytest.ini_options]
pythonpath = [".", "../clinical-document-parser"]
testpaths = ["tests"]
